<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff4f8b"><title>Lumo · Profil</title><link rel="icon" href="/lumo-icon.svg"><style>:root{--bg:#fff9fc;--p:#fff;--p2:#fff2f7;--line:#f0dfe7;--txt:#241823;--mut:#8b7584;--ac:#ff4f8b;--ac2:#8c5cff;--shadow:0 18px 60px rgba(97,35,69,.10)}html[data-theme=dark]{--bg:#0d0b10;--p:#17131a;--p2:#211923;--line:#302733;--txt:#fff7fb;--mut:#b9aab4;--shadow:0 18px 60px #0006}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#ff4f8b12,transparent 28%),var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}button,input,textarea{font:inherit}.top{height:64px;position:sticky;top:0;z-index:5;background:#ffffffdd;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(14px,calc((100% - 760px)/2))}html[data-theme=dark] .top{background:#17131ae8}.icon{width:40px;height:40px;border:0;border-radius:14px;background:var(--p2);color:var(--txt);display:grid;place-items:center;text-decoration:none}.brand{display:flex;align-items:center;gap:9px;font-weight:900}.orb{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:white;display:grid;place-items:center}.wrap{max-width:760px;margin:auto;padding:20px 14px 80px}.card{background:var(--p);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.cover{height:210px;background:linear-gradient(135deg,#ffd5e4,#d9ccff);background-size:cover;background-position:center;position:relative}.profile{padding:0 22px 22px}.avatar{width:112px;height:112px;border-radius:50%;margin-top:-56px;position:relative;border:5px solid var(--p);background:linear-gradient(135deg,#ffd4e2,#d9ccff);background-size:cover;background-position:center;display:grid;place-items:center;font-size:34px;font-weight:900}.nameRow{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-top:10px}.nameRow h1{margin:0;font-size:25px;letter-spacing:-.7px}.handle,.mut{color:var(--mut)}.bio{line-height:1.5;font-size:14px;margin:12px 0}.status{display:inline-block;background:var(--p2);border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:11px;color:var(--mut)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.stat{background:var(--p2);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--mut)}.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:850;cursor:pointer;background:var(--p2);color:var(--txt);text-decoration:none;display:inline-grid;place-items:center}.btn.primary{background:linear-gradient(135deg,var(--ac),#ff7a7a);color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.section{margin-top:18px;padding:20px}.section h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tile{aspect-ratio:1;background:var(--p2);border-radius:12px;overflow:hidden;display:grid;place-items:center;color:var(--mut);text-decoration:none;font-size:10px}.tile img,.tile video{width:100%;height:100%;object-fit:cover}.modal{position:fixed;inset:0;background:#25101f77;backdrop-filter:blur(5px);z-index:20;display:grid;place-items:center;padding:14px}.modal.hide{display:none}.box{width:min(500px,100%);max-height:90vh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:26px;padding:20px}.box h3{margin-top:0}.form{display:grid;gap:11px}.form input,.form textarea{width:100%;border:1px solid var(--line);background:var(--p2);color:var(--txt);border-radius:14px;padding:12px;outline:none}.files{display:grid;grid-template-columns:1fr 1fr;gap:8px}.file{display:block;text-align:center;background:var(--p2);border:1px dashed #e59ab8;border-radius:14px;padding:11px;font-size:12px}.file input{display:none}.close{float:right}.empty{text-align:center;color:var(--mut);padding:24px}.danger{color:#d6385d}.loading{min-height:50vh;display:grid;place-items:center;color:var(--mut)}@media(max-width:560px){.cover{height:165px}.profile{padding:0 15px 17px}.avatar{width:96px;height:96px;margin-top:-48px}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding-left:9px;padding-right:9px}.section{padding:15px}.grid{gap:3px}}</style></head><body><header class="top"><a href="/" class="icon">‹</a><div class="brand"><span class="orb">L</span>Lumo Profil</div><a href="/settings.html" class="icon">⚙</a></header><main class="wrap"><div id="root" class="loading">Profil yuklanmoqda...</div></main><div id="modal" class="modal hide"><div class="box"><button id="close" class="btn close">×</button><h3>Profilni tahrirlash</h3><form id="edit" class="form"><div class="files"><label class="file">Avatar yuklash<input id="avatarFile" type="file" accept="image/*"></label><label class="file">Cover yuklash<input id="coverFile" type="file" accept="image/*"></label></div><input name="name" placeholder="Ism"><textarea name="bio" rows="3" placeholder="Bio"></textarea><input name="status" placeholder="Status"><input name="website" placeholder="Website"><input name="birthday" placeholder="Tug‘ilgan sana"><button class="btn primary">Saqlash</button></form></div></div><script>const T=localStorage.lumo||'';if(!T)location.href='/';const root=document.querySelector('#root'),modal=document.querySelector('#modal'),edit=document.querySelector('#edit');let DATA=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){const h={...(o.body instanceof FormData?{}:{'content-type':'application/json'}),authorization:'Bearer '+T},r=await fetch(p,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Xato');return d}function ini(s){return(s||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function tile(x){const m=x.file||{};if(String(m.mime||'').startsWith('image/'))return`<a class="tile" target="_blank" href="${esc(m.url)}"><img src="${esc(m.url)}"></a>`;if(String(m.mime||'').startsWith('video/'))return`<a class="tile" target="_blank" href="${esc(m.url)}"><video src="${esc(m.url)}"></video></a>`;return`<a class="tile" target="_blank" href="${esc(m.url)}">${esc(m.name||'Fayl')}</a>`}async function load(){try{DATA=await api('/api/profile/me');const m=await api('/api/profile/media');const u=DATA.user,p=DATA.profile,s=DATA.stats;root.className='';root.innerHTML=`<section class="card"><div class="cover" style="${p.cover?`background-image:url('${esc(p.cover)}')`:''}"></div><div class="profile"><div class="avatar" style="${u.avatar?`background-image:url('${esc(u.avatar)}')`:''}">${u.avatar?'':ini(u.name)}</div><div class="nameRow"><div><h1>${esc(u.name)}</h1><div class="handle">@${esc(u.username)}</div></div><span class="status">${esc(p.status||'Lumo foydalanuvchisi')}</span></div><div class="bio">${esc(u.bio||'Bio hali yozilmagan')}</div>${p.website?`<a class="mut" target="_blank" rel="noopener" href="${esc(p.website)}">${esc(p.website)}</a>`:''}<div class="stats"><div class="stat"><b>${s.chats}</b><span>Chat</span></div><div class="stat"><b>${s.groups}</b><span>Guruh</span></div><div class="stat"><b>${s.channels}</b><span>Kanal</span></div><div class="stat"><b>${s.stories}</b><span>Story</span></div></div><div class="actions"><button id="editBtn" class="btn primary">Profilni tahrirlash</button><a href="/settings.html" class="btn">Sozlamalar</a></div></div></section><section class="card section"><h3>Media</h3>${m.media.length?`<div class="grid">${m.media.map(tile).join('')}</div>`:'<div class="empty">Hali media yuborilmagan</div>'}</section>`;document.querySelector('#editBtn').onclick=openEdit}catch(e){root.className='empty';root.textContent=e.message}}function openEdit(){const u=DATA.user,p=DATA.profile;edit.name.value=u.name||'';edit.bio.value=u.bio||'';edit.status.value=p.status||'';edit.website.value=p.website||'';edit.birthday.value=p.birthday||'';modal.classList.remove('hide')}document.querySelector('#close').onclick=()=>modal.classList.add('hide');modal.onclick=e=>{if(e.target===modal)modal.classList.add('hide')};async function upload(id){const f=document.querySelector(id).files[0];if(!f)return'';const fd=new FormData();fd.append('file',f);return(await api('/api/upload',{method:'POST',body:fd})).file.url}edit.onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.primary');b.disabled=true;b.textContent='Saqlanmoqda...';try{const fd=Object.fromEntries(new FormData(e.target)),avatar=await upload('#avatarFile'),cover=await upload('#coverFile');if(avatar)fd.avatar=avatar;if(cover)fd.cover=cover;await api('/api/profile/me',{method:'PATCH',body:JSON.stringify(fd)});modal.classList.add('hide');await load()}catch(x){alert(x.message)}finally{b.disabled=false;b.textContent='Saqlash'}};document.documentElement.dataset.theme=localStorage.lumoTheme==='dark'?'dark':'light';load();</script></body></html>
