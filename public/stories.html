<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff4f8b"><title>Lumo · Stories</title><link rel="icon" href="/lumo-icon.svg"><style>:root{--bg:#fff9fc;--p:#fff;--p2:#fff2f7;--line:#f0dfe7;--txt:#241823;--mut:#8b7584;--ac:#ff4f8b;--ac2:#8c5cff;--shadow:0 18px 60px rgba(97,35,69,.10)}html[data-theme=dark]{--bg:#0d0b10;--p:#17131a;--p2:#211923;--line:#302733;--txt:#fff7fb;--mut:#b9aab4;--shadow:0 18px 60px #0006}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#ff4f8b12,transparent 28%),var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}.top{height:64px;position:sticky;top:0;z-index:5;background:#ffffffdd;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(14px,calc((100% - 760px)/2))}html[data-theme=dark] .top{background:#17131ae8}.icon,.btn{border:0;border-radius:14px;background:var(--p2);color:var(--txt);padding:10px 13px;font-weight:800;text-decoration:none;cursor:pointer}.icon{width:40px;height:40px;display:grid;place-items:center}.brand{font-weight:900}.wrap{max-width:760px;margin:auto;padding:18px 12px 80px}.card{background:var(--p);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}.story{display:grid;grid-template-columns:100px 1fr;gap:14px}.preview{width:100px;height:150px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#ffd5e4,#d9ccff);display:grid;place-items:center;color:#6b4f64;text-align:center;padding:8px}.preview img,.preview video{width:100%;height:100%;object-fit:cover}.meta{font-size:10px;color:var(--mut);margin-top:6px}.txt{font-size:13px;line-height:1.5;white-space:pre-wrap;margin:8px 0}.row{display:flex;gap:7px;flex-wrap:wrap}.primary{background:linear-gradient(135deg,var(--ac),#ff787a);color:#fff}.danger{background:#fff0f4;color:#d73860}html[data-theme=dark] .danger{background:#381925}.empty{text-align:center;color:var(--mut);padding:40px}.modal{position:fixed;inset:0;background:#25101f77;backdrop-filter:blur(5px);z-index:20;display:grid;place-items:center;padding:14px}.modal.hide{display:none}.box{width:min(500px,100%);background:var(--p);border:1px solid var(--line);border-radius:24px;padding:18px}.box h3{margin-top:0}.form{display:grid;gap:10px}.form textarea{width:100%;border:1px solid var(--line);background:var(--p2);color:var(--txt);border-radius:14px;padding:12px;outline:none}.file{display:block;text-align:center;background:var(--p2);border:1px dashed #e59ab8;border-radius:14px;padding:11px;font-size:12px}.file input{display:none}.close{float:right}.badge{display:inline-block;background:var(--p2);border:1px solid var(--line);border-radius:99px;padding:5px 8px;font-size:10px;margin-right:4px}.loading{text-align:center;color:var(--mut);padding:30px}@media(max-width:560px){.story{grid-template-columns:78px 1fr}.preview{width:78px;height:120px}.wrap{padding-left:8px;padding-right:8px}.card{border-radius:20px;padding:12px}}</style></head><body><header class="top"><a href="/" class="icon">‹</a><div class="brand">Lumo Stories</div><a href="/profile.html" class="icon">☺</a></header><main class="wrap"><div id="root" class="loading">Stories yuklanmoqda...</div></main><div id="modal" class="modal hide"><div class="box"><button id="close" class="btn close">×</button><h3>Story tahriri</h3><form id="edit" class="form"><textarea id="storyText" rows="5" placeholder="Story matni"></textarea><label class="file">Media almashtirish<input id="storyMedia" type="file" accept="image/*,video/*"></label><div id="mediaName" class="meta"></div><button class="btn primary">Saqlash</button></form></div></div><script>const T=localStorage.lumo||'';if(!T)location.href='/';document.documentElement.dataset.theme=localStorage.lumoTheme==='dark'?'dark':'light';const root=document.querySelector('#root'),modal=document.querySelector('#modal');let current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){const h={...(o.body instanceof FormData?{}:{'content-type':'application/json'}),authorization:'Bearer '+T},r=await fetch(p,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Xato');return d}function media(s){const m=s.media||{};if(!m.url)return'<div class="preview">Faqat matn</div>';if(String(m.mime||'').startsWith('video/'))return`<div class="preview"><video controls src="${esc(m.url)}"></video></div>`;return`<div class="preview"><img src="${esc(m.url)}"></div>`}function reactionBadges(a=[]){const c={};a.forEach(e=>c[e]=(c[e]||0)+1);return Object.entries(c).map(([e,n])=>`<span class="badge">${esc(e)} ${n}</span>`).join('')||'<span class="meta">Reaksiya yo‘q</span>'}async function load(){try{const d=await api('/api/stories-mine');root.className='';root.innerHTML=d.stories.length?'':'<div class="empty">Faol story yo‘q</div>';d.stories.forEach(s=>{const x=document.createElement('section');x.className='card story';x.innerHTML=`${media(s)}<div><div class="meta">${new Date(s.createdAt).toLocaleString()} · ${s.views} ko‘rish</div><div class="txt">${esc(s.text||'Media story')}</div><div>${reactionBadges(s.reactions)}</div><div class="row" style="margin-top:10px"><button class="btn" data-edit>Tahrirlash</button><button class="btn danger" data-del>O‘chirish</button></div></div>`;x.querySelector('[data-edit]').onclick=()=>openEdit(s);x.querySelector('[data-del]').onclick=async()=>{if(confirm('Story o‘chirilsinmi?')){await api('/api/stories/'+s.id,{method:'DELETE'});load()}};root.append(x)})}catch(e){root.className='empty';root.textContent=e.message}}function openEdit(s){current=s;document.querySelector('#storyText').value=s.text||'';document.querySelector('#storyMedia').value='';document.querySelector('#mediaName').textContent='';modal.classList.remove('hide')}document.querySelector('#close').onclick=()=>modal.classList.add('hide');modal.onclick=e=>{if(e.target===modal)modal.classList.add('hide')};document.querySelector('#storyMedia').onchange=e=>document.querySelector('#mediaName').textContent=e.target.files[0]?.name||'';async function upload(){const f=document.querySelector('#storyMedia').files[0];if(!f)return undefined;const fd=new FormData();fd.append('file',f);return(await api('/api/upload',{method:'POST',body:fd})).file}document.querySelector('#edit').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.primary');b.disabled=true;b.textContent='Saqlanmoqda...';try{const body={text:document.querySelector('#storyText').value},m=await upload();if(m)body.media=m;await api('/api/stories/'+current.id,{method:'PATCH',body:JSON.stringify(body)});modal.classList.add('hide');load()}catch(x){alert(x.message)}finally{b.disabled=false;b.textContent='Saqlash'}};load();</script></body></html>
