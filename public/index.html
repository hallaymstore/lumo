<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d5dfc"><meta name="description" content="Lumo — chatlar, guruhlar, kanallar va botlar"><link rel="manifest" href="/manifest.json"><title>Lumo Messenger</title><style>:root{--bg:#080c17;--p:#0d1324;--p2:#121a2f;--soft:#17213a;--line:#ffffff12;--txt:#f6f8fc;--mut:#8f9ab4;--ac:#6d5dfc;--mine:#5d4ce0}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt)}button,input,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}.auth{min-height:100%;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 20% 20%,#6d5dfc35,transparent 30%),var(--bg)}.card{width:min(430px,100%);background:var(--p);border:1px solid var(--line);border-radius:24px;padding:22px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#8e80ff,#4c3ed1);font-weight:900;font-size:25px}.brand h1{margin:0}.mut{color:var(--mut)}.tabs{display:flex;background:var(--soft);padding:4px;border-radius:13px}.tabs button{flex:1;border:0;border-radius:10px;background:transparent;color:var(--mut);padding:10px}.tabs .on{background:var(--p2);color:var(--txt)}form{display:grid;gap:11px;margin-top:15px}input,textarea{width:100%;border:1px solid var(--line);background:var(--p2);color:var(--txt);border-radius:12px;padding:12px;outline:none}.primary{border:0;background:var(--ac);color:#fff;border-radius:12px;padding:12px;font-weight:800}.app{height:100dvh;display:grid;grid-template-columns:350px 1fr}.side{background:var(--p);border-right:1px solid var(--line);display:grid;grid-template-rows:auto auto auto 1fr auto;min-width:0}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}.mini{width:38px;height:38px;border-radius:13px;font-size:18px}.search{margin:0 12px 10px}.search input{padding:10px 12px}.nav{display:flex;gap:4px;padding:0 12px 8px}.nav button{flex:1;border:0;background:transparent;color:var(--mut);padding:8px;border-radius:10px;font-size:12px}.nav .on{background:var(--soft);color:var(--txt)}.list{overflow:auto;padding:4px 7px}.item{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:9px;align-items:center;border:0;background:transparent;color:var(--txt);padding:8px;border-radius:13px;text-align:left}.item:hover,.item.on{background:var(--soft)}.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#28334e;color:#fff;font-weight:800;background-size:cover;background-position:center}.av.ch{border-radius:13px}.title{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prev,.small{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.foot{border-top:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:8px}.me{flex:1;display:flex;gap:9px;align-items:center;border:0;background:transparent;color:var(--txt);min-width:0}.new{width:40px;height:40px;border:0;border-radius:13px;background:var(--ac);color:#fff;font-size:22px}.pane{min-width:0;position:relative}.empty{height:100%;display:grid;place-content:center;text-align:center;color:var(--mut)}.chat{height:100%;display:grid;grid-template-rows:62px 1fr 20px auto}.head{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--p);border-bottom:1px solid var(--line)}.head .grow{flex:1;min-width:0}.msgs{overflow:auto;padding:18px max(16px,calc((100% - 820px)/2));display:flex;flex-direction:column;gap:7px}.msg{display:flex;gap:7px;align-items:flex-end;max-width:min(76%,650px)}.msg.mine{margin-left:auto;flex-direction:row-reverse}.msg .av{width:28px;height:28px;font-size:10px}.bubble{background:#151e35;border:1px solid var(--line);padding:9px 11px;border-radius:15px 15px 15px 5px;font-size:13px;line-height:1.4;word-break:break-word}.mine .bubble{background:var(--mine);border-color:transparent;border-radius:15px 15px 5px 15px}.sender{font-size:10px;font-weight:800;color:#aa9fff}.time{font-size:9px;opacity:.65;float:right;margin:7px 0 -3px 10px}.file{display:block;color:inherit;text-decoration:none;background:#ffffff12;padding:8px;border-radius:10px;margin-top:6px}.file img{display:block;max-width:100%;max-height:300px;border-radius:8px;margin-bottom:5px}.react{margin-top:5px}.react button{border:0;border-radius:99px;background:#ffffff18;color:inherit;padding:2px 7px}.typing{font-size:10px;color:var(--mut);padding:0 max(16px,calc((100% - 820px)/2))}.composer{display:flex;align-items:flex-end;gap:5px;margin:0 max(12px,calc((100% - 860px)/2)) max(10px,env(safe-area-inset-bottom));padding:6px;background:var(--p);border:1px solid var(--line);border-radius:17px}.composer textarea{border:0;background:transparent;resize:none;max-height:120px;padding:9px}.ico{width:38px;height:38px;border:0;border-radius:12px;background:transparent;color:var(--mut);font-size:20px}.send{background:var(--ac);color:#fff}.modal{position:fixed;inset:0;background:#0009;z-index:30;display:grid;place-items:center;padding:16px}.mcard{width:min(500px,100%);max-height:86dvh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:20px;padding:18px;position:relative}.close{position:absolute;right:10px;top:10px}.row{display:flex;gap:8px}.row>*{flex:1}.res{display:flex;align-items:center;gap:9px;padding:8px;border:1px solid var(--line);border-radius:12px;margin-top:7px}.grow{flex:1;min-width:0}.smBtn{border:0;background:var(--soft);color:var(--txt);border-radius:10px;padding:8px 10px}.code{background:#050914;border-radius:10px;padding:10px;word-break:break-all;font:11px monospace}.mobile{display:none}@media(max-width:760px){.app{grid-template-columns:1fr}.pane{position:fixed;inset:0;z-index:20;background:var utton id="back" class="ico mobile">‹</button><div id="hav" class="av"></div><div class="grow"><div id="ht" class="title"></div><div id="hs" class="small"></div></div><button id="info" class="ico">⋯</button></div><div id="msgs" class="msgs"></div><div id="typing" class="typing"></div><form id="compose" class="composer"><input id="file" type="file" hidden><button type="button" id="attach" class="ico">＋</button><textarea id="text" rows="1" placeholder="Xabar yozing..."></textarea><button class="ico send">➤</button></form></div></section></main><div id="modal" class="modal hide"><div class="mcard"><button id="x" class="ico close">×</button><div id="mb"></div></div></div><script src="/socket.io/socket.io.js"></script><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],S={t:localStorage.lumo||'',me:null,chats:[],active:null,msgs:[],tab:'chats',sock:null};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ini=s=>(s||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();function av(e,o,n){let u=typeof o==='string'?o:o?.avatar,l=n||(typeof o==='object'?(o?.name||o?.username):'');e.style.backgroundImage=u?`url("${u}")`:'';e.textContent=u?'':ini(l)}async function api(p,o={}){let h={...(o.body instanceof FormData?{}:{'content-type':'application/json'}),...(S.t?{authorization:'Bearer '+S.t}:{})},r=await fetch(p,{...o,headers:h}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Xato');return d}function err(e){alert(e.message||e)}function modal(h){$('#mb').innerHTML=h;$('#modal').classList.remove('hide')}function close(){$('#modal').classList.add('hide')}$('#x').onclick=close;$('#modal').onclick=e=>{if(e.target===$('#modal'))close()};$$('[data-a]').forEach(b=>b.onclick=()=>{$$('[data-a]').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#login').classList.toggle('hide',b.dataset.a!=='login');$('#reg').classList.toggle('hide',b.dataset.a==='login')});$('#login').onsubmit=e=>auth(e,'/api/login');$('#reg').onsubmit=e=>auth(e,'/api/register');async function auth(e,p){e.preventDefault();try{let d=await api(p,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});S.t=d.token;S.me=d.user;localStorage.lumo=d.token;start()}catch(e){err(e)}}async function start(){if(!S.me){try{S.me=(await api('/api/me')).user}catch{localStorage.removeItem('lumo');S.t='';return}}$('#auth').classList.add('hide');$('#app').classList.remove('hide');$('#mn').textContent=S.me.name;$('#mu').textContent='@'+S.me.username;av($('#mav'),S.me);sock();await chats();side()}function sock(){if(S.sock)S.sock.disconnect();S.sock=io({auth:{token:S.t}});S.sock.on('message',m=>{if(S.active?.id===m.chat){S.msgs.push(m);drawMsgs()}chats(false)});S.sock.on('reaction',d=>{let m=S.msgs.find(x=>x.id===d.id);if(m){m.reactions=d.reactions;drawMsgs()}});S.sock.on('typing',d=>{if(S.active?.id===d.chatId)$('#typing').textContent=d.on?d.name+' yozmoqda...':''})}async function chats(r=true){S.chats=(await api('/api/chats')).chats;if(r)side()}$$('[data-tab]').forEach(b=>b.onclick=()=>{$$('[data-tab]').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.tab=b.dataset.tab;side()});$('#q').oninput=side;function side(){let l=$('#list'),q=$('#q').value.toLowerCase();if(S.tab==='chats'){l.innerHTML='';S.chats.filter(c=>!q||c.title.toLowerCase().includes(q)).forEach(c=>{let b=document.createElement('button');b.className='item'+(S.active?.id===c.id?' on':'');let a=document.createElement('div');a.className='av '+(c.type==='channel'?'ch':'');av(a,c.avatar,c.title);b.append(a);let m=c.lastMessage,p=m?((m.sender?.name?m.sender.name+': ':'')+(m.text||m.file?.name||'Fayl')):(c.type==='channel'?'Kanal':c.type==='group'?'Guruh':'Yangi chat');b.insertAdjacentHTML('beforeend',`<div><div class="title">${esc(c.title)}</div><div class="prev">${esc(p)}</div></div><div class="small">${m?new Date(m.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2- sgs.forEach(m=>{let mine=m.sender?.id===S.me.id,e=document.createElement('div');e.className='msg '+(mine?'mine':'');let a=document.createElement('div');a.className='av';av(a,m.sender);e.append(a);let b=document.createElement('div');b.className='bubble';let h=!mine&&S.active?.type!=='dm'?`<div class="sender">${esc(m.sender?.name||'User')}</div>`:'';h+=m.text?`<div>${esc(m.text).replace(/\n/g,'<br>')}</div>`:'';if(m.file){let im=(m.file.mime||'').startsWith('image/');h+=`<a class="file" target="_blank" href="${esc(m.file.url)}">${im?`<img src="${esc(m.file.url)}">`:''}📎 ${esc(m.file.name)}</a>`}h+=`<span class="time">${new Date(m.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>`;if(m.reactions?.some(r=>r.users?.length))h+=`<div class="react">${m.reactions.filter(r=>r.users?.length).map(r=>`<button>${esc(r.emoji)} ${r.users.length}</button>`).join('')}</div>`;b.innerHTML=h;b.ondblclick=()=>react(m.id);e.append(b);box.append(e)});box.scrollTop=box.scrollHeight}async function react(id){let d=await api('/api/messages/'+id+'/react',{method:'POST',body:JSON.stringify({emoji:'❤️'})}),m=S.msgs.find(x=>x.id===id);if(m){m.reactions=d.reactions;drawMsgs()}}$('#compose').onsubmit=async e=>{e.preventDefault();let t=$('#text'),v=t.value.trim();if(!v||!S.active)return;t.value='';try{await api('/api/chats/'+S.active.id+'/messages',{method:'POST',body:JSON.stringify({text:v})})}catch(e){err(e)}};let tt;$('#text').oninput=()=>{if(!S.active)return;S.sock?.emit('typing',{chatId:S.active.id,on:true});clearTimeout(tt);tt=setTimeout(()=>S.sock?.emit('typing',{chatId:S.active.id,on:false}),800)};$('#attach').onclick=()=>$('#file').click();$('#file').onchange=async e=>{let f=e.target.files[0];if(!f||!S.active)return;let fd=new FormData();fd.append('file',f);try{let u=await api('/api/upload',{method:'POST',body:fd});await api('/api/chats/'+S.active.id+'/messages',{method:'POST',body:JSON.stringify({file:u.file})})}catch(e){err(e)}e.target.value=''};$('#back').onclick umobot" required><button class="primary">Yaratish</button></form>`);$('#bf').onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/bots',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});modal(`<h3>Bot tayyor 🤖</h3><div class="small">Token faqat hozir ko‘rsatiladi</div><div class="code">${esc(d.bot.token)}</div><p class="small">POST /bot/TOKEN/sendMessage<br>POST /bot/TOKEN/setWebhook<br>GET /bot/TOKEN/getMe</p>`)}catch(e){err(e)}}}function botEdit(b){modal(`<h3>🤖 ${esc(b.name)}</h3><div class="code">@${esc(b.username)}</div><form id="be"><input name="webhook" value="${esc(b.webhook||'')}" placeholder="Webhook URL"><button class="primary">Saqlash</button></form>`);$('#be').onsubmit=async e=>{e.preventDefault();await api('/api/bots/'+b.id,{method:'PATCH',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});close();bots()}}$('#profile').onclick=()=>modal(`<h3>${esc(S.me.name)}</h3><div class="code">@${esc(S.me.username)}</div><button id="out" class="primary" style="margin-top:12px;width:100%">Chiqish</button>`);document.addEventListener('click',e=>{if(e.target.id==='out'){localStorage.removeItem('lumo');location.reload()}});$('#info').onclick=()=>{let c=S.active;if(c)modal(`<h3>${esc(c.title)}</h3><p>${esc(c.description||'Tavsif yo‘q')}</p><div class="code">Chat ID: ${esc(c.id)}</div>`)};$('#theme').onclick=()=>document.body.style.filter=document.body.style.filter?'':'brightness(.96) saturate(.95)';if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});S.t?start():0;</script></body></html>
