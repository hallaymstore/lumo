<!doctype html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff4f8b">
  <meta name="description" content="Lumo — tezkor chatlar, guruhlar, kanallar va botlar">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/lumo-icon.svg">
  <title>Lumo Messenger</title>
  <style>
    :root{
      --bg:#fff9fc;--p:#ffffff;--p2:#fff2f7;--soft:#fff0f6;--line:#f0dfe7;
      --txt:#241823;--mut:#8b7584;--ac:#ff4f8b;--ac2:#8c5cff;--mine:#ff4f8b;
      --shadow:0 18px 60px rgba(97,35,69,.10);--shadow-sm:0 8px 28px rgba(97,35,69,.08);
      --nav:rgba(255,255,255,.88);--bubble:#fff;--chatbg:#fff9fc
    }
    html[data-theme="dark"]{
      --bg:#0d0b10;--p:#17131a;--p2:#211923;--soft:#261c28;--line:#302733;
      --txt:#fff7fb;--mut:#b9aab4;--mine:#ff4f8b;--shadow:0 18px 60px rgba(0,0,0,.35);
      --shadow-sm:0 8px 28px rgba(0,0,0,.24);--nav:rgba(20,16,22,.90);--bubble:#211923;--chatbg:#0d0b10
    }
    *{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}
    body{background:radial-gradient(circle at 16% 0%,rgba(255,79,139,.10),transparent 28%),radial-gradient(circle at 90% 8%,rgba(140,92,255,.07),transparent 23%),var(--bg)}
    button,input,textarea,select{font:inherit}button{cursor:pointer}.hide{display:none!important}svg{display:block}.icon{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .auth{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,rgba(255,79,139,.14),transparent 32%),radial-gradient(circle at 82% 82%,rgba(140,92,255,.10),transparent 30%),var(--bg)}
    .card{width:min(440px,100%);background:var(--p);border:1px solid var(--line);border-radius:30px;padding:28px;box-shadow:var(--shadow)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.brand h1{margin:0;font-size:28px;letter-spacing:-1px}.brand b{font-size:20px;letter-spacing:-.5px}.mut{color:var(--mut)}
    .logo{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 12px 28px rgba(255,79,139,.30);position:relative;overflow:hidden}
    .logo:after{content:"";position:absolute;width:40px;height:40px;border-radius:50%;background:#fff;filter:blur(24px);opacity:.18;right:-16px;top:-15px}.logo svg{width:30px;height:30px;position:relative;z-index:1}.logo.mini{width:40px;height:40px;border-radius:14px;box-shadow:0 8px 20px rgba(255,79,139,.24)}.logo.mini svg{width:22px;height:22px}
    .tabs{display:flex;background:var(--p2);padding:5px;border-radius:16px;border:1px solid var(--line)}.tabs button{flex:1;border:0;border-radius:12px;background:transparent;color:var(--mut);padding:11px 10px;font-weight:750}.tabs .on{background:var(--p);color:var(--txt);box-shadow:var(--shadow-sm)}
    form{display:grid;gap:11px;margin-top:16px}input,textarea,select{width:100%;border:1px solid var(--line);background:var(--p2);color:var(--txt);border-radius:14px;padding:12px 13px;outline:none;transition:.16s border-color,.16s box-shadow}.card input{padding:14px}input:focus,textarea:focus,select:focus{border-color:#ff8ab1;box-shadow:0 0 0 4px rgba(255,79,139,.08)}
    .primary{border:0;background:linear-gradient(135deg,var(--ac),#ff787a);color:#fff;border-radius:14px;padding:12px 15px;font-weight:850;box-shadow:0 10px 24px rgba(255,79,139,.20)}.primary:hover{filter:brightness(1.02)}
    .app{height:100dvh;display:grid;grid-template-columns:360px 1fr;max-width:1500px;margin:auto;background:var(--p);box-shadow:0 0 80px rgba(80,34,60,.05)}
    .side{background:var(--nav);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--line);display:grid;grid-template-rows:auto auto auto 1fr auto;min-width:0;z-index:5}
    .top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:10px 15px}.top .brand{margin:0}.search{margin:0 12px 10px;position:relative}.search:before{content:"";position:absolute;left:13px;top:50%;width:15px;height:15px;border:2px solid var(--mut);border-radius:50%;transform:translateY(-58%);opacity:.8}.search:after{content:"";position:absolute;left:26px;top:27px;width:6px;height:2px;background:var(--mut);transform:rotate(45deg);border-radius:2px;opacity:.8}.search input{padding:11px 12px 11px 40px;background:var(--p2)}
    .nav{display:flex;gap:5px;padding:0 12px 10px}.nav button{flex:1;border:0;background:transparent;color:var(--mut);padding:9px 5px 8px;border-radius:14px;font-size:10px;font-weight:750;display:grid;place-items:center;gap:4px}.nav button svg{width:19px;height:19px}.nav .on{background:var(--p2);color:var(--ac)}
    .list{overflow:auto;padding:4px 8px 10px;scrollbar-width:thin;scrollbar-color:#e7bdcf transparent}.item{width:100%;display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;border:0;background:transparent;color:var(--txt);padding:9px;border-radius:17px;text-align:left;transition:.14s}.item:hover,.item.on{background:var(--p2)}
    .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffd4e2,#d9ccff);color:#5a3850;font-weight:850;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}html[data-theme="dark"] .av{color:#fff;background:linear-gradient(135deg,#633149,#473368)}.av.ch{border-radius:15px}.title{font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prev,.small{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prev{margin-top:2px}
    .foot{border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;background:var(--nav)}.me{flex:1;display:flex;gap:9px;align-items:center;border:0;background:transparent;color:var(--txt);min-width:0;text-align:left;padding:2px;border-radius:14px}.me:hover{background:var(--p2)}
    .new{width:44px;height:44px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px rgba(255,79,139,.26)}.new svg{width:22px;height:22px}
    .pane{min-width:0;position:relative;background:radial-gradient(circle at 50% 0%,rgba(255,79,139,.045),transparent 34%),var(--chatbg)}.empty{height:100%;display:grid;place-content:center;text-align:center;color:var(--mut);padding:24px}.empty h2{color:var(--txt);margin:18px 0 6px;letter-spacing:-.6px}.empty .logo{margin:auto}
    .chat{height:100%;display:grid;grid-template-rows:66px 1fr 22px auto}.head{display:flex;align-items:center;gap:10px;padding:9px 15px;background:var(--nav);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);z-index:3}.head .grow{flex:1;min-width:0}.head .av{width:42px;height:42px}
    .msgs{overflow:auto;padding:22px max(18px,calc((100% - 830px)/2));display:flex;flex-direction:column;gap:8px}.msg{display:flex;gap:8px;align-items:flex-end;max-width:min(76%,650px)}.msg.mine{margin-left:auto;flex-direction:row-reverse}.msg .av{width:29px;height:29px;font-size:10px;flex:0 0 auto}
    .bubble{background:var(--bubble);border:1px solid var(--line);padding:10px 12px;border-radius:18px 18px 18px 6px;font-size:13px;line-height:1.45;word-break:break-word;box-shadow:0 5px 16px rgba(70,35,60,.045)}.mine .bubble{background:linear-gradient(135deg,#ff4f8b,#ff6e7d);color:#fff;border-color:transparent;border-radius:18px 18px 6px 18px;box-shadow:0 7px 20px rgba(255,79,139,.17)}.sender{font-size:10px;font-weight:850;color:var(--ac);margin-bottom:2px}.time{font-size:9px;opacity:.62;float:right;margin:7px 0 -3px 10px}
    .file{display:block;color:inherit;text-decoration:none;background:rgba(255,255,255,.16);padding:8px;border-radius:12px;margin-top:7px}.msg:not(.mine) .file{background:var(--p2)}.file img{display:block;max-width:100%;max-height:320px;border-radius:10px;margin-bottom:6px}.react{margin-top:6px}.react button{border:1px solid rgba(255,255,255,.14);border-radius:99px;background:rgba(255,255,255,.15);color:inherit;padding:3px 8px}.msg:not(.mine) .react button{background:var(--p2);border-color:var(--line)}
    .typing{font-size:10px;color:var(--mut);padding:0 max(18px,calc((100% - 830px)/2));min-height:20px}.composer{display:flex;align-items:flex-end;gap:5px;margin:0 max(13px,calc((100% - 870px)/2)) max(11px,env(safe-area-inset-bottom));padding:6px;background:var(--p);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 32px rgba(70,35,60,.08)}.composer textarea{border:0;background:transparent;resize:none;max-height:120px;padding:10px;box-shadow:none}.composer textarea:focus{box-shadow:none}.ico{width:40px;height:40px;border:0;border-radius:14px;background:transparent;color:var(--mut);display:grid;place-items:center}.ico:hover{background:var(--p2);color:var(--txt)}.ico svg{width:21px;height:21px}.send{background:linear-gradient(135deg,var(--ac),#ff787a);color:#fff;box-shadow:0 7px 18px rgba(255,79,139,.20)}.send:hover{background:linear-gradient(135deg,var(--ac),#ff787a);color:#fff}
    .modal{position:fixed;inset:0;background:rgba(35,15,30,.36);backdrop-filter:blur(6px);z-index:30;display:grid;place-items:center;padding:16px}.mcard{width:min(510px,100%);max-height:86dvh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:26px;padding:22px;position:relative;box-shadow:0 26px 80px rgba(68,30,52,.24)}.mcard h3{margin:4px 44px 10px 0;letter-spacing:-.35px}.close{position:absolute;right:12px;top:12px}.row{display:flex;gap:8px}.row>*{flex:1}.res{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);background:var(--p);border-radius:15px;margin-top:8px}.res:hover{background:var(--p2)}.grow{flex:1;min-width:0}.smBtn{border:1px solid var(--line);background:var(--p2);color:var(--txt);border-radius:12px;padding:9px 11px;font-weight:750}.code{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:11px;word-break:break-all;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.mobile{display:none}
    .auth .card:before{content:"Lumo Messenger";display:inline-flex;align-items:center;color:var(--ac);font-size:10px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:14px}.premium-note{font-size:11px;color:var(--mut);margin-top:14px;text-align:center}.premium-note b{color:var(--ac)}
    @media(max-width:760px){.app{grid-template-columns:1fr}.side{border-right:0}.pane{position:fixed;inset:0;z-index:20;background:var(--chatbg);transform:translateX(100%);transition:.18s ease}.app.open .pane{transform:translateX(0)}.mobile{display:grid}.msgs{padding:15px 9px}.msg{max-width:91%}.composer{margin:0 7px max(7px,env(safe-area-inset-bottom));border-radius:18px}.typing{padding:0 11px}.mcard{border-radius:26px 26px 0 0;position:absolute;bottom:0;max-height:92dvh;width:100%}.modal{align-items:end;padding:0}.top{height:62px}.chat{grid-template-rows:62px 1fr 22px auto}.head{padding:8px 9px}.nav{padding-bottom:7px}}
    @media(max-width:380px){.card{padding:22px;border-radius:24px}.app{font-size:14px}.nav button{font-size:9px}.item{grid-template-columns:42px 1fr auto;padding:7px}.av{width:40px;height:40px}}
  </style>
</head>
<body>
  <section id="auth" class="auth">
    <div class="card">
      <div class="brand">
        <div class="logo" data-logo></div>
        <div><h1>Lumo</h1><div class="mut">Sodda. Tez. Yaqin.</div></div>
      </div>
      <div class="tabs"><button class="on" data-a="login">Kirish</button><button data-a="reg">Ro‘yxatdan o‘tish</button></div>
      <form id="login"><input name="login" placeholder="username yoki email" autocomplete="username" required><input name="password" type="password" placeholder="parol" autocomplete="current-password" required><button class="primary">Kirish</button></form>
      <form id="reg" class="hide"><input name="name" placeholder="ism" required><input name="username" placeholder="username" autocomplete="username" required><input name="email" type="email" placeholder="email (ixtiyoriy)"><input name="password" type="password" minlength="6" placeholder="parol" autocomplete="new-password" required><button class="primary">Profil yaratish</button></form>
      <div class="premium-note">Lumo · <b>private chat</b> · guruh · kanal · bot</div>
    </div>
  </section>

  <main id="app" class="app hide">
    <aside class="side">
      <div class="top">
        <div class="brand" style="margin:0"><div class="logo mini" data-logo></div><b>Lumo</b></div>
        <button id="theme" class="ico" aria-label="Mavzuni almashtirish"></button>
      </div>
      <div class="search"><input id="q" placeholder="Qidirish"></div>
      <div class="nav">
        <button class="on" data-tab="chats" data-icon="chat">Chatlar</button>
        <button data-tab="explore" data-icon="compass">Explore</button>
        <button data-tab="bots" data-icon="bot">Botlar</button>
      </div>
      <div id="list" class="list"></div>
      <div class="foot">
        <button id="profile" class="me"><div id="mav" class="av"></div><div class="grow"><div id="mn" class="title"></div><div id="mu" class="small"></div></div></button>
        <button id="new" class="new" aria-label="Yangi suhbat"></button>
      </div>
    </aside>

    <section class="pane">
      <div id="empty" class="empty"><div><div class="logo" data-logo></div><h2>Lumo</h2><div>Chat tanlang yoki yangi suhbat boshlang</div></div></div>
      <div id="chat" class="chat hide">
        <div class="head">
          <button id="back" class="ico mobile" aria-label="Orqaga"></button>
          <div id="hav" class="av"></div>
          <div class="grow"><div id="ht" class="title"></div><div id="hs" class="small"></div></div>
          <button id="info" class="ico" aria-label="Chat ma’lumoti"></button>
        </div>
        <div id="msgs" class="msgs"></div>
        <div id="typing" class="typing"></div>
        <form id="compose" class="composer"><input id="file" type="file" hidden><button type="button" id="attach" class="ico" aria-label="Fayl biriktirish"></button><textarea id="text" rows="1" placeholder="Xabar yozing..."></textarea><button class="ico send" aria-label="Yuborish"></button></form>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hide"><div class="mcard"><button id="x" class="ico close" aria-label="Yopish"></button><div id="mb"></div></div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const ICONS={
      logo:`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7.5 7.5h17v11.2c0 3.1-2.5 5.6-5.6 5.6h-5.2L8 28l1.3-3.7H7.5A4.5 4.5 0 0 1 3 19.8V12A4.5 4.5 0 0 1 7.5 7.5Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="m17.8 11.2.9 2.2 2.3.9-2.3.9-.9 2.3-.9-2.3-2.2-.9 2.2-.9.9-2.2Z" fill="currentColor" stroke="none"/></svg>`,
      chat:`<svg class="icon" viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3 1.7-4.3A7 7 0 0 1 3 13V8a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>`,
      compass:`<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>`,
      bot:`<svg class="icon" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="4"/><path d="M12 3v4M8 12h.01M16 12h.01M8 16h8"/></svg>`,
      moon:`<svg class="icon" viewBox="0 0 24 24"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"/></svg>`,
      sun:`<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
      plus:`<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>`,
      back:`<svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>`,
      info:`<svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/></svg>`,
      clip:`<svg class="icon" viewBox="0 0 24 24"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.6-8.6"/></svg>`,
      send:`<svg class="icon" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/></svg>`,
      close:`<svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>`
    };
    document.querySelectorAll('[data-logo]').forEach(x=>x.innerHTML=ICONS.logo);
    document.querySelectorAll('[data-icon]').forEach(x=>x.insertAdjacentHTML('afterbegin',ICONS[x.dataset.icon]||''));
    document.querySelector('#new').innerHTML=ICONS.plus;
    document.querySelector('#back').innerHTML=ICONS.back;
    document.querySelector('#info').innerHTML=ICONS.info;
    document.querySelector('#attach').innerHTML=ICONS.clip;
    document.querySelector('.send').innerHTML=ICONS.send;
    document.querySelector('#x').innerHTML=ICONS.close;

    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],S={t:localStorage.lumo||'',me:null,chats:[],active:null,msgs:[],tab:'chats',sock:null};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const ini=s=>(s||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
    function av(e,o,n){let u=typeof o==='string'?o:o?.avatar,l=n||(typeof o==='object'?(o?.name||o?.username):'');e.style.backgroundImage=u?`url("${u}")`:'';e.textContent=u?'':ini(l)}
    async function api(p,o={}){let h={...(o.body instanceof FormData?{}:{'content-type':'application/json'}),...(S.t?{authorization:'Bearer '+S.t}:{})},r=await fetch(p,{...o,headers:h}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Xato');return d}
    function err(e){alert(e.message||e)}
    function modal(h){$('#mb').innerHTML=h;$('#modal').classList.remove('hide')}
    function close(){$('#modal').classList.add('hide')}
    $('#x').onclick=close;$('#modal').onclick=e=>{if(e.target===$('#modal'))close()};

    $$('[data-a]').forEach(b=>b.onclick=()=>{$$('[data-a]').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#login').classList.toggle('hide',b.dataset.a!=='login');$('#reg').classList.toggle('hide',b.dataset.a==='login')});
    $('#login').onsubmit=e=>auth(e,'/api/login');$('#reg').onsubmit=e=>auth(e,'/api/register');
    async function auth(e,p){e.preventDefault();try{let d=await api(p,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});S.t=d.token;S.me=d.user;localStorage.lumo=d.token;start()}catch(e){err(e)}}
    async function start(){if(!S.me){try{S.me=(await api('/api/me')).user}catch{localStorage.removeItem('lumo');S.t='';return}}$('#auth').classList.add('hide');$('#app').classList.remove('hide');$('#mn').textContent=S.me.name;$('#mu').textContent='@'+S.me.username;av($('#mav'),S.me);sock();await chats();side()}
    function sock(){if(S.sock)S.sock.disconnect();S.sock=io({auth:{token:S.t}});S.sock.on('message',m=>{if(S.active?.id===m.chat){S.msgs.push(m);drawMsgs()}chats(false)});S.sock.on('reaction',d=>{let m=S.msgs.find(x=>x.id===d.id);if(m){m.reactions=d.reactions;drawMsgs()}});S.sock.on('typing',d=>{if(S.active?.id===d.chatId)$('#typing').textContent=d.on?d.name+' yozmoqda...':''})}
    async function chats(r=true){S.chats=(await api('/api/chats')).chats;if(r)side()}
    $$('[data-tab]').forEach(b=>b.onclick=()=>{$$('[data-tab]').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.tab=b.dataset.tab;side()});$('#q').oninput=side;
    function side(){let l=$('#list'),q=$('#q').value.toLowerCase();if(S.tab==='chats'){l.innerHTML='';S.chats.filter(c=>!q||c.title.toLowerCase().includes(q)).forEach(c=>{let b=document.createElement('button');b.className='item'+(S.active?.id===c.id?' on':'');let a=document.createElement('div');a.className='av '+(c.type==='channel'?'ch':'');av(a,c.avatar,c.title);b.append(a);let m=c.lastMessage,p=m?((m.sender?.name?m.sender.name+': ':'')+(m.text||m.file?.name||'Fayl')):(c.type==='channel'?'Kanal':c.type==='group'?'Guruh':'Yangi chat');b.insertAdjacentHTML('beforeend',`<div><div class="title">${esc(c.title)}</div><div class="prev">${esc(p)}</div></div><div class="small">${m?new Date(m.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}</div>`);b.onclick=()=>open(c);l.append(b)});if(!l.children.length)l.innerHTML='<div class="empty">Hali chat yo‘q</div>'}else if(S.tab==='explore')explore(q);else bots()}
    async function explore(q){let l=$('#list');l.innerHTML='<div class="empty">Yuklanmoqda...</div>';try{let d=await api('/api/explore?q='+encodeURIComponent(q));l.innerHTML='';d.chats.forEach(c=>{let r=document.createElement('div');r.className='res';r.innerHTML=`<div class="av ch">${ini(c.title)}</div><div class="grow"><div class="title">${esc(c.title)}</div><div class="small">${c.type} · ${c.memberCount} a’zo</div></div>`;let b=document.createElement('button');b.className='smBtn';b.textContent=c.members.some(m=>m.user?.id===S.me.id)?'Ochish':'Qo‘shilish';b.onclick=async()=>{if(b.textContent==='Qo‘shilish'){await api('/api/chats/'+c.id+'/join',{method:'POST'});await chats(false)}open(S.chats.find(x=>x.id===c.id)||c)};r.append(b);l.append(r)});if(!d.chats.length)l.innerHTML='<div class="empty">Topilmadi</div>'}catch(e){err(e)}}
    async function bots(){let l=$('#list');try{let d=await api('/api/bots');l.innerHTML='';d.bots.forEach(b=>{let r=document.createElement('div');r.className='res';r.innerHTML=`<div class="av ch">🤖</div><div class="grow"><div class="title">${esc(b.name)}</div><div class="small">@${esc(b.username)}</div></div>`;r.onclick=()=>botEdit(b);l.append(r)});let n=document.createElement('button');n.className='primary';n.style='width:calc(100% - 12px);margin:6px';n.textContent='＋ Bot yaratish';n.onclick=botNew;l.append(n)}catch(e){err(e)}}
    async function open(c){S.active=c;$('#app').classList.add('open');$('#empty').classList.add('hide');$('#chat').classList.remove('hide');$('#ht').textContent=c.title;$('#hs').textContent=c.type==='dm'?(c.username?'@'+c.username:'Lumo'):(c.memberCount+' a’zo');av($('#hav'),c.avatar,c.title);S.sock?.emit('join',c.id);S.msgs=(await api('/api/chats/'+c.id+'/messages')).messages;drawMsgs();side()}
    function drawMsgs(){let box=$('#msgs');box.innerHTML='';S.msgs.forEach(m=>{let mine=m.sender?.id===S.me.id,e=document.createElement('div');e.className='msg '+(mine?'mine':'');let a=document.createElement('div');a.className='av';av(a,m.sender);e.append(a);let b=document.createElement('div');b.className='bubble';let h=!mine&&S.active?.type!=='dm'?`<div class="sender">${esc(m.sender?.name||'User')}</div>`:'';h+=m.text?`<div>${esc(m.text).replace(/\n/g,'<br>')}</div>`:'';if(m.file){let im=(m.file.mime||'').startsWith('image/');h+=`<a class="file" target="_blank" rel="noopener" href="${esc(m.file.url)}">${im?`<img src="${esc(m.file.url)}" alt="">`:''}📎 ${esc(m.file.name)}</a>`}h+=`<span class="time">${new Date(m.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>`;if(m.reactions?.some(r=>r.users?.length))h+=`<div class="react">${m.reactions.filter(r=>r.users?.length).map(r=>`<button>${esc(r.emoji)} ${r.users.length}</button>`).join('')}</div>`;b.innerHTML=h;b.ondblclick=()=>react(m.id);e.append(b);box.append(e)});box.scrollTop=box.scrollHeight}
    async function react(id){let d=await api('/api/messages/'+id+'/react',{method:'POST',body:JSON.stringify({emoji:'❤️'})}),m=S.msgs.find(x=>x.id===id);if(m){m.reactions=d.reactions;drawMsgs()}}
    $('#compose').onsubmit=async e=>{e.preventDefault();let t=$('#text'),v=t.value.trim();if(!v||!S.active)return;t.value='';try{await api('/api/chats/'+S.active.id+'/messages',{method:'POST',body:JSON.stringify({text:v})})}catch(e){err(e)}};
    let tt;$('#text').oninput=()=>{if(!S.active)return;S.sock?.emit('typing',{chatId:S.active.id,on:true});clearTimeout(tt);tt=setTimeout(()=>S.sock?.emit('typing',{chatId:S.active.id,on:false}),800)};
    $('#attach').onclick=()=>$('#file').click();$('#file').onchange=async e=>{let f=e.target.files[0];if(!f||!S.active)return;let fd=new FormData();fd.append('file',f);try{let u=await api('/api/upload',{method:'POST',body:fd});await api('/api/chats/'+S.active.id+'/messages',{method:'POST',body:JSON.stringify({file:u.file})})}catch(e){err(e)}e.target.value=''};
    $('#back').onclick=()=>$('#app').classList.remove('open');
    $('#new').onclick=()=>modal(`<h3>Yangi suhbat</h3><div style="display:grid;gap:8px"><button id="dm" class="primary">Shaxsiy chat</button><button id="gr" class="smBtn">Guruh yaratish</button><button id="ch" class="smBtn">Kanal yaratish</button></div>`);
    document.addEventListener('click',e=>{if(e.target.id==='dm')userFind();if(e.target.id==='gr')space('group');if(e.target.id==='ch')space('channel')});
    function userFind(){modal(`<h3>Odam topish</h3><input id="uq" placeholder="ism yoki username"><div id="ur"></div>`);let t;$('#uq').oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{let d=await api('/api/users?q='+encodeURIComponent($('#uq').value)),o=$('#ur');o.innerHTML='';d.users.forEach(u=>{let r=document.createElement('div');r.className='res';r.innerHTML=`<div class="av">${ini(u.name)}</div><div class="grow"><div class="title">${esc(u.name)}</div><div class="small">@${esc(u.username)}</div></div>`;let b=document.createElement('button');b.className='smBtn';b.textContent='Yozish';b.onclick=async()=>{let d=await api('/api/dm',{method:'POST',body:JSON.stringify({userId:u.id})});await chats(false);close();open(d.chat)};r.append(b);o.append(r)})},220)}}
    function space(type){modal(`<h3>${type==='channel'?'Kanal':'Guruh'} yaratish</h3><form id="sf"><input name="title" placeholder="nomi" required><input name="username" placeholder="username"><textarea name="description" placeholder="tavsif"></textarea><label class="small"><input name="public" type="checkbox" style="width:auto"> Ochiq bo‘lsin</label><button class="primary">Yaratish</button></form>`);$('#sf').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.type=type;f.public=!!f.public;try{let d=await api('/api/chats',{method:'POST',body:JSON.stringify(f)});await chats(false);close();open(d.chat)}catch(e){err(e)}}}
    function botNew(){modal(`<h3>Bot yaratish</h3><form id="bf"><input name="name" placeholder="Bot nomi" required><input name="username" placeholder="masalan lumobot" required><button class="primary">Yaratish</button></form>`);$('#bf').onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/bots',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});modal(`<h3>Bot tayyor 🤖</h3><div class="small">Token faqat hozir ko‘rsatiladi</div><div class="code">${esc(d.bot.token)}</div>`)}catch(e){err(e)}}}
    function botEdit(b){modal(`<h3>${esc(b.name)}</h3><div class="code">@${esc(b.username)}</div><form id="be"><input name="webhook" value="${esc(b.webhook||'')}" placeholder="Webhook URL"><button class="primary">Saqlash</button></form>`);$('#be').onsubmit=async e=>{e.preventDefault();await api('/api/bots/'+b.id,{method:'PATCH',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});close();bots()}}
    $('#profile').onclick=()=>modal(`<h3>${esc(S.me.name)}</h3><div class="code">@${esc(S.me.username)}</div><button id="out" class="primary" style="margin-top:12px;width:100%">Chiqish</button>`);
    document.addEventListener('click',e=>{if(e.target.id==='out'){localStorage.removeItem('lumo');location.reload()}});
    $('#info').onclick=()=>{let c=S.active;if(c)modal(`<h3>${esc(c.title)}</h3><p>${esc(c.description||'Tavsif yo‘q')}</p><div class="code">Chat ID: ${esc(c.id)}</div>`)};

    function setTheme(t){document.documentElement.dataset.theme=t;localStorage.lumoTheme=t;$('#theme').innerHTML=t==='dark'?ICONS.sun:ICONS.moon;document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#17131a':'#ff4f8b'}
    setTheme(localStorage.lumoTheme==='dark'?'dark':'light');$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
    if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});S.t?start():0;
  </script>
  <script src="/bot-v2.js?v=3"></script>
</body>
</html>
