<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff4f8b"><title>Lumo · Sozlamalar</title><link rel="icon" href="/lumo-icon.svg"><style>:root{--bg:#fff9fc;--p:#fff;--p2:#fff2f7;--line:#f0dfe7;--txt:#241823;--mut:#8b7584;--ac:#ff4f8b;--ac2:#8c5cff;--shadow:0 18px 60px rgba(97,35,69,.10)}html[data-theme=dark]{--bg:#0d0b10;--p:#17131a;--p2:#211923;--line:#302733;--txt:#fff7fb;--mut:#b9aab4;--shadow:0 18px 60px #0006}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#ff4f8b12,transparent 28%),var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}.top{height:64px;position:sticky;top:0;z-index:5;background:#ffffffdd;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(14px,calc((100% - 680px)/2))}html[data-theme=dark] .top{background:#17131ae8}.icon{width:40px;height:40px;border:0;border-radius:14px;background:var(--p2);color:var(--txt);display:grid;place-items:center;text-decoration:none}.brand{font-weight:900}.wrap{max-width:680px;margin:auto;padding:18px 12px 80px}.card{background:var(--p);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}.card h2{font-size:15px;margin:0 0 12px}.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.grow{flex:1}.row b{font-size:13px}.row small{display:block;color:var(--mut);font-size:10px;margin-top:3px;line-height:1.35}.switch{position:relative;width:46px;height:27px;flex:0 0 auto}.switch input{display:none}.switch span{position:absolute;inset:0;border-radius:99px;background:#d8cbd2;transition:.18s}.switch span:after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:3px;left:3px;box-shadow:0 2px 8px #0002;transition:.18s}.switch input:checked+span{background:linear-gradient(135deg,var(--ac),var(--ac2))}.switch input:checked+span:after{transform:translateX(19px)}.btn{width:100%;border:0;border-radius:14px;padding:12px;font-weight:850;background:var(--p2);color:var(--txt);cursor:pointer;margin-top:8px}.primary{background:linear-gradient(135deg,var(--ac),#ff787a);color:#fff}.danger{color:#d73860;background:#fff0f4}html[data-theme=dark] .danger{background:#381925}.themeRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.themeBtn{border:1px solid var(--line);background:var(--p2);color:var(--txt);border-radius:14px;padding:13px;font-weight:800}.themeBtn.on{border-color:#ff86ae;color:var(--ac);box-shadow:0 0 0 3px #ff4f8b12}.foot{text-align:center;color:var(--mut);font-size:10px;padding:18px}.loading{text-align:center;color:var(--mut);padding:30px}@media(max-width:520px){.wrap{padding-left:9px;padding-right:9px}.card{border-radius:20px;padding:15px}}</style></head><body><header class="top"><a href="/profile.html" class="icon">‹</a><div class="brand">Lumo · Sozlamalar</div><a href="/" class="icon">⌂</a></header><main class="wrap"><section class="card"><h2>Ko‘rinish</h2><div class="themeRow"><button class="themeBtn" data-theme="light">☀️ Oq</button><button class="themeBtn" data-theme="dark">🌙 Tungi</button></div></section><section class="card"><h2>Maxfiylik</h2><div id="settings" class="loading">Yuklanmoqda...</div></section><section class="card"><h2>Hisob</h2><a href="/profile.html" class="btn" style="display:block;text-align:center;text-decoration:none">Profilni tahrirlash</a><button id="logout" class="btn danger">Hisobdan chiqish</button></section><div class="foot">Lumo Messenger · White/Pink Premium UI</div></main><script>const T=localStorage.lumo||'';if(!T)location.href='/';const defs=[['lastSeen','Oxirgi faollik','Boshqalar sizning oxirgi faolligingizni ko‘ra oladi'],['readReceipts','O‘qildi belgisi','Xabar o‘qilganini ko‘rsatish'],['discoverable','Qidiruvda topilish','Username va ism orqali sizni topish mumkin'],['notifications','Bildirishnomalar','Yangi xabar va voqealar haqida xabar berish'],['storyReplies','Story reaksiyalari','Storyga reaksiya va javoblarni qabul qilish'],['autoplayVideo','Video autoplay','Story va post videolarini avtomatik boshlash']];async function api(p,o={}){const r=await fetch(p,{...o,headers:{'content-type':'application/json',authorization:'Bearer '+T}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Xato');return d}function setTheme(t){document.documentElement.dataset.theme=t;localStorage.lumoTheme=t;document.querySelectorAll('.themeBtn').forEach(b=>b.classList.toggle('on',b.dataset.theme===t));document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#17131a':'#ff4f8b'}setTheme(localStorage.lumoTheme==='dark'?'dark':'light');document.querySelectorAll('.themeBtn').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));async function load(){const d=await api('/api/settings'),box=document.querySelector('#settings');box.className='';box.innerHTML=defs.map(([k,t,s])=>`<label class="row"><div class="grow"><b>${t}</b><small>${s}</small></div><span class="switch"><input type="checkbox" data-k="${k}" ${d.settings[k]?'checked':''}><span></span></span></label>`).join('');box.querySelectorAll('input').forEach(x=>x.onchange=async()=>{try{await api('/api/settings',{method:'PATCH',body:JSON.stringify({[x.dataset.k]:x.checked})})}catch(e){x.checked=!x.checked;alert(e.message)}})}document.querySelector('#logout').onclick=()=>{if(confirm('Hisobdan chiqilsinmi?')){localStorage.removeItem('lumo');location.href='/'}};load().catch(e=>document.querySelector('#settings').textContent=e.message);</script></body></html>
